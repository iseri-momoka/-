# mypy config for PCCM
[mypy]
python_version = 3.11
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[mypy-pccm.core.*]
disallow_untyped_defs = true

[mypy-pccm.algorithms.*]
disallow_untyped_defs = true

[mypy-pccm.gui.*]
# GUI layer: more relaxed
disallow_untyped_defs = false

[mypy-pccm.plugins.*]
disallow_untyped_defs = false
