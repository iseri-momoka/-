"""CI contract enforcement — import-linter rules for PCCM.

This file configures ``import-linter`` (``pip install import-linter``)
to verify that Qt imports never leak into the core/algorithms/io layers.

See ``.pre-commit-config.yaml`` for how it runs in pre-commit hooks.
"""

[importlinter]

root_package = pccm

[importlinter:contract:1_no_qt_in_core]
name = No Qt in core
type = forbid
source_modules = pccm.core
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:2_no_qt_in_algorithms]
name = No Qt in algorithms
type = forbid
source_modules = pccm.algorithms
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:3_no_qt_in_io]
name = No Qt in I/O
type = forbid
source_modules = pccm.io
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:4_no_qt_in_plugins]
name = No Qt in plugins
type = forbid
source_modules = pccm.plugins
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:5_no_qt_in_spatial]
name = No Qt in spatial
type = forbid
source_modules = pccm.spatial
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:6_no_qt_in_tools]
name = No Qt in tools
type = forbid
source_modules = pccm.tools
forbidden_modules = PySide6, PyQt5, PyQt6, qtpy, Qt

[importlinter:contract:7_core_independent]
name = Core does not depend on algorithms or gui
type = forbid
source_modules = pccm.core
forbidden_modules = pccm.algorithms, pccm.gui, pccm.io, pccm.tools, pccm.plugins
