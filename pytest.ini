[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    gui: GUI tests that require a display; run with `xvfb-run pytest -m gui`
    slow: Slow tests (>5s)
markers.allow_inheritance = true
filterwarnings =
    ignore::DeprecationWarning:open3d.*
    ignore::DeprecationWarning:laspy.*
